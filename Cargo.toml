[package]
name = "api"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true        # Link Time Optimization — binaire plus rapide
codegen-units = 1 # Meilleure optimisation, build plus lent
strip = true      # Supprime les symboles de debug — binaire plus petit

[dependencies]
# API
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
tokio = { version = "1.54.1", features = ["full"] }
dotenvy = "0.15.7"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
utoipa-axum = "0.3.0"

# Middlewares (CORS, logs, limites, compression)
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.1", features = [
    "cors",
    "trace",
    "catch-panic",
    "compression-gzip",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Database
# `postgres_backend` (et non `postgres`) : pas de libpq, tout passe par diesel-async
diesel = { version = "2.4.0", features = ["postgres_backend", "uuid", "chrono"] }
diesel-async = { version = "0.10.0", features = ["postgres", "bb8", "migrations"] }
diesel_migrations = "2.4.0"

# Utils
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
time = "0.3.55" # type Duration de l'API cookie (axum-extra)

# Auth & sécurité
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
bcrypt = "0.19.3"
governor = "0.10.4"

[dev-dependencies]
cucumber = "0.23.0"

[[test]]
name = "cucumber"
harness = false
